
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Study App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Flashcard Study App</h1>
            <p>Learn something new, one card at a time.</p>
        </header>

        <main>
            <div class="progress-section">
                <div class="progress-info">
                    <span id="card-count">Card 1 of 10</span>
                    <span id="progress-percent">10%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>

            <div class="card-container" id="card-container">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <span class="card-label">QUESTION</span>
                        <h2 id="question">What is the use of frontend?</h2>
                        <p>Click the card to reveal the answer</p>
                    </div>

                    <div class="card-face card-back">
                        <span class="card-label">ANSWER</span>
                        <h2 id="answer"></h2>
                        <p>Click again to see the question</p>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="prev-btn">← Previous</button>
                <button id="flip-btn">Flip Card</button>
                <button id="next-btn">Next →</button>
            </div>

            <button id="shuffle-btn">↻ Shuffle Cards</button>
        </main>

        <footer>
            <p>Keep learning. Keep growing.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
